name: production-verifier

on:
  push:
    branches:
      - ops/prod-verify-afa561b9
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: afa561b93baef009a0f1d54058f8f728bc168dce
      PROD_ALIAS: https://voodoo-skillset-voodoo-caser.vercel.app
      DEPLOYMENT_URL: https://voodoo-skillset-554oi4xff-voodoo-caser.vercel.app
    steps:
      - name: Independent production HTTP verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          expected = os.environ['EXPECTED_SHA']
          urls = [
              ('production_alias', os.environ['PROD_ALIAS']),
              ('deployment_url', os.environ['DEPLOYMENT_URL']),
          ]

          failures = []
          for label, base in urls:
              print(f'=== {label}: {base} ===')
              try:
                  req = urllib.request.Request(base + '/api/health', headers={'User-Agent': 'VOODOO-SKILLSET-independent-verifier/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = resp.read().decode('utf-8', errors='replace')
                      print('health_status=', resp.status)
                      print('health_body=', body[:2000])
                      if resp.status != 200:
                          failures.append(f'{label}: health status {resp.status}')
                          continue
                      data = json.loads(body)
                      if data.get('status') != 'ok':
                          failures.append(f"{label}: status={data.get('status')!r}")
                      if data.get('version') != '0.3.0':
                          failures.append(f"{label}: version={data.get('version')!r}")
                      if data.get('canonical_sha') != expected:
                          failures.append(f"{label}: canonical_sha={data.get('canonical_sha')!r} expected={expected}")
              except Exception as exc:
                  failures.append(f'{label}: health request failed: {exc!r}')

              try:
                  req = urllib.request.Request(base + '/', headers={'User-Agent': 'VOODOO-SKILLSET-independent-verifier/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      html = resp.read().decode('utf-8', errors='replace')
                      print('root_status=', resp.status)
                      print('root_prefix=', html[:400].replace('\n', ' '))
                      if resp.status != 200:
                          failures.append(f'{label}: root status {resp.status}')
                      if 'VOODOO' not in html or 'SKILLSET' not in html:
                          failures.append(f'{label}: Control Room identity missing')
              except Exception as exc:
                  failures.append(f'{label}: root request failed: {exc!r}')

          if failures:
              print('=== VERDICT: FAIL ===')
              for item in failures:
                  print('-', item)
              sys.exit(1)

          print('=== VERDICT: PASS ===')
          print('canonical_sha=', expected)
          PY
